name: Update vehicle listings

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch listings
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
        run: python fetch_listings.py
      - name: Build landing pages
        run: python build_pages.py
      - name: Save the new data
        run: |
          git add -A listings.json geo_cache.json browse sitemap.xml index.html 2>/dev/null || git add listings.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git config user.name "listings-bot"
            git config user.email "listings-bot@users.noreply.github.com"
            git commit -m "Update vehicle listings and pages"
            git push
          fi
